<style>
  :root{

    --mist:#8A8A84; --line:#E4E4DF; --ok:#0F7B4D; --warn:#B26A00; --live:#D0021B;
    --card:#FFFFFF; --accent-soft:#9DB0FF;
  }
  html[data-theme="dark"]{
    --paper:#0C0C0B; --ink:#F2F2EE; --mat:#5C77FF;
    --mist:#7C7C76; --line:#262623; --ok:#3DC98B; --warn:#E0A030; --live:#FF4D5E;

  html{color-scheme:light}
  html[data-theme="dark"]{color-scheme:dark}

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.45}
  a{color:inherit}

  header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 10px;border-bottom:1px solid var(--line)}
  .brand{font-family:'Anton',sans-serif;font-size:28px;letter-spacing:.02em;line-height:1;text-transform:uppercase}
  .brand span{color:var(--mat)}
  .postbtn{
    appearance:none;cursor:pointer;border:2px solid var(--ink);background:none;color:var(--ink);
    font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.12em;
    text-transform:uppercase;padding:8px 12px;transition:all .15s;
  }
  .postbtn:hover{background:var(--ink);color:var(--paper)}
  .postbtn:focus-visible{outline:2px solid var(--mat);outline-offset:2px}
  .modeswitch{display:flex;border:2px solid var(--ink);cursor:pointer;user-select:none}
  .modeswitch:focus-visible{outline:2px solid var(--mat);outline-offset:2px}
  .mode-opt{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:8px 10px;color:var(--mist);transition:all .15s;white-space:nowrap}

  .searchbar{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--paper)}
  .searchbar input{flex:1;border:1px solid var(--line);background:var(--card);padding:12px 14px;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;color:var(--ink)}
  .searchbar input::placeholder{color:var(--mist);text-transform:uppercase;letter-spacing:.06em;font-size:11px}
  .searchbar input:focus{outline:2px solid var(--mat);outline-offset:-1px}
  .btn{appearance:none;border:0;cursor:pointer;background:var(--ink);color:var(--paper);font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:0 16px}
  .btn.alt{background:var(--mat)}
  .btn:focus-visible{outline:2px solid var(--mat);outline-offset:2px}
  .locstatus{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mat);padding:8px 16px 0;display:none}
  .locstatus button{appearance:none;border:0;background:none;cursor:pointer;color:var(--mist);font:inherit;text-decoration:underline;margin-left:8px}

  .daystrip{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:600}
  .day{appearance:none;border:0;background:none;cursor:pointer;font-family:'Anton',sans-serif;font-size:clamp(15px,4.2vw,24px);letter-spacing:.03em;text-transform:uppercase;padding:14px 0 10px;color:var(--mist);border-right:1px solid var(--line);position:relative;transition:color .15s}
  .day:last-child{border-right:0}
  .day:hover{color:var(--ink)}
  .day:focus-visible{outline:2px solid var(--mat);outline-offset:-2px}
  .day.active{color:var(--ink)}
  .day.active::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--mat)}
  .day .today-dot{display:block;font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.2em;color:var(--mat);height:10px;margin-top:2px}

  .filters{display:flex;gap:8px;padding:12px 16px 0;flex-wrap:wrap}
  .chip{appearance:none;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:7px 12px;transition:all .12s}
  .chip:hover{border-color:var(--ink)}
  .chip.on{background:var(--mat);border-color:var(--mat);color:#fff}
  .chip:focus-visible{outline:2px solid var(--mat);outline-offset:2px}

  .wrap{display:flex;flex-direction:column;height:calc(100dvh - 190px)}
  #map{height:32dvh;min-height:200px;border-bottom:1px solid var(--line)}
  .list{flex:1;overflow-y:auto;padding:6px 16px 90px}
  .count{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mist);margin:10px 2px 12px}

  .card{border:1px solid var(--line);background:var(--card);padding:16px 16px 14px;margin-bottom:12px;cursor:pointer;transition:border-color .15s,transform .1s;position:relative}
  .card:hover{border-color:var(--ink)}
  .card:active{transform:scale(.995)}
  .card.done{opacity:.55}
  .card.live{border-color:var(--live)}
  .status{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;margin-bottom:8px;display:inline-block;padding:3px 8px}
  .status.live{background:var(--live);color:#fff;animation:pulse 1.6s infinite}
  .status.soon{background:var(--ink);color:#fff}
  .status.done{background:var(--line);color:var(--mist)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  .card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .gym{font-family:'Anton',sans-serif;font-size:19px;letter-spacing:.015em;text-transform:uppercase;line-height:1.15}
  .town{font-size:13px;color:var(--mist);margin-top:2px}
  .dist{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--mat)}
  .time{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;white-space:nowrap;text-align:right;line-height:1.3}
  .time small{display:block;font-size:10px;letter-spacing:.12em;color:var(--mist);font-weight:600}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .tag{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);padding:4px 8px;color:var(--ink)}
  .tag.free{border-color:var(--mat);color:var(--mat)}
  .card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);gap:10px}
  .verify{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
  .verify.ok{color:var(--ok)}
  .verify.warn{color:var(--warn)}
  .foot-actions{display:flex;gap:14px;align-items:center}

  .empty{text-align:center;padding:52px 20px;color:var(--mist)}
  .empty .big{font-family:'Anton',sans-serif;font-size:26px;color:var(--ink);text-transform:uppercase;margin-bottom:6px}

  .modal .btn{padding:14px 20px;flex:1}
  .modal .btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:56px;background:var(--ink);color:var(--paper);font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:12px 18px;z-index:950;display:none}

    .wrap{flex-direction:row-reverse}
    #map{height:auto;flex:1.1;border-bottom:0;border-left:1px solid var(--line)}
    .list{flex:1;max-width:560px;padding:6px 24px 90px}
    .brand{font-size:34px}
    .overlay{align-items:center}
    .modal{border:1px solid var(--line);border-top:4px solid var(--mat)}

  @media(prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>

<header>
  <div class="brand">OPEN<span>MAT</span></div>
  <div style="display:flex;gap:8px;align-items:center">
    <div class="modeswitch" id="themeBtn" role="button" tabindex="0" aria-label="Switch between day and night mode">
      <span class="mode-opt" data-mode="light">☀ Day</span><span class="mode-opt" data-mode="dark">☾ Night</span>
    </div>
    <button class="postbtn" id="openPost">+ Post a mat</button>
  </div>
</header>

<div class="searchbar">
  <input id="q" type="text" inputmode="search" placeholder="Zip · City · Town" aria-label="Search by zip code, city, or town">
  <button class="btn" id="goBtn">Go</button>
  <button class="btn alt" id="nearBtn" title="Use my location">Near me</button>
</div>
<div class="locstatus" id="locstatus"></div>

<div class="daystrip" id="daystrip" role="tablist" aria-label="Day of week"></div>
<div class="filters" id="filters">
  <button class="chip" data-f="free">Free only</button>
  <button class="chip" data-f="gi">Gi</button>
  <button class="chip" data-f="nogi">No-Gi</button>
</div>

<div class="wrap">
  <div id="map" aria-label="Map of open mats"></div>
  <div class="list">
    <div class="count" id="count"></div>
    <div id="cards"></div>
  </div>
</div>

<div class="note">Data checked by hand · <span id="lastupdate"></span> · <button id="openPost2">Know a mat we're missing?</button></div>

<!-- post a mat modal -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="pm-title">
  <div class="modal">
    <h2 id="pm-title">Post a mat</h2>
    <p>It lands on your map right away. We verify it, then it goes live for everyone.</p>
    <div class="field"><label for="f-gym">Gym name</label><input id="f-gym" type="text" placeholder="e.g. Revel Jiu Jitsu"></div>
    <div class="field"><label for="f-address">Address</label><input id="f-address" type="text" placeholder="e.g. 8 Edgeboro Rd, East Brunswick NJ"></div>
    <div class="field"><label for="f-town">Town</label><input id="f-town" type="text" placeholder="e.g. East Brunswick"></div>
    <div class="field"><label for="f-day">Day</label>
      <select id="f-day"><option>Sunday</option><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option></select>
    </div>
    <div class="field"><label for="f-time">Time</label><input id="f-time" type="text" placeholder="e.g. 10:00 AM to 12:00 PM"></div>
    <div class="field"><label for="f-format">Format</label>
      <select id="f-format"><option>Gi + No-Gi</option><option>Gi</option><option>No-Gi</option></select>
    </div>
    <div class="field"><label for="f-cost">Cost</label><input id="f-cost" type="text" placeholder="e.g. Free / $20 drop-in"></div>
    <div class="field"><label for="f-contact">Your email or IG (so we can confirm)</label><input id="f-contact" type="text" placeholder="you@email.com or @handle"></div>
    <div class="actions">
      <button class="btn ghost" id="closePost">Cancel</button>
      <button class="btn alt" id="sendPost">Send it</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  { gym:"The Academy of Jiu-Jitsu", town:"Toms River", county:"Ocean", lat:39.9774, lng:-74.1389,

  { gym:"The Academy of Jiu-Jitsu", town:"Toms River", county:"Ocean", lat:39.9774, lng:-74.1389,
    day:0, start:"8:30 AM", end:"10:00 AM", startH:8.5, endH:10.0, format:"No-Gi", cost:"Ask gym",
    verified:"confirmed", verifiedDate:"2026-07-26", site:"https://theacademyjj.com/schedule", ig:"" }
];

/* ========================================================= */
const DAYS = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
const DAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

/* pending mats: posted from this device, shown locally until we verify them */
let PENDING = (()=>{try{return JSON.parse(localStorage.getItem("openmat-pending"))||[];}catch(e){return [];}})();
function savePending(){try{localStorage.setItem("openmat-pending",JSON.stringify(PENDING));}catch(e){}}
function allMats(){return MATS.concat(PENDING);}
const now = new Date();
const todayIdx = now.getDay();
let activeDay = todayIdx;
let userLoc = null;
let filters = {free:false, gi:false, nogi:false};
let markers = [], youMarker = null;

document.getElementById("lastupdate").textContent = "Updated " + LAST_UPDATE;

/* theme */
const TILE_LIGHT="https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png";
const TILE_DARK="https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png";
let tileLayer=null;
function applyTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  try{localStorage.setItem("openmat-theme",t);}catch(e){}
  if(tileLayer){tileLayer.setUrl(t==="dark"?TILE_DARK:TILE_LIGHT);}
}
const savedTheme=(()=>{try{return localStorage.getItem("openmat-theme");}catch(e){return null;}})();
const startTheme=savedTheme||(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
document.documentElement.setAttribute("data-theme",startTheme);
function paintSwitch(){
  const cur=document.documentElement.getAttribute("data-theme");
  document.querySelectorAll(".mode-opt").forEach(o=>o.classList.toggle("on",o.dataset.mode===cur));
}
const themeBtn=document.getElementById("themeBtn");
themeBtn.onclick=(e)=>{
  const picked=e.target.dataset&&e.target.dataset.mode;
  const cur=document.documentElement.getAttribute("data-theme");
  applyTheme(picked||(cur==="dark"?"light":"dark"));
  paintSwitch();
};
themeBtn.onkeydown=(e)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();themeBtn.onclick({target:themeBtn});}};
paintSwitch();

/* status per mat */
function matStatus(m){
  if(m.day!==todayIdx || m.startH===null) return null;
  const nowH = new Date().getHours() + new Date().getMinutes()/60;
  if(nowH >= m.startH && nowH < m.endH) return {cls:"live", label:"ON THE MATS NOW"};
  if(nowH < m.startH){
    const dh = m.startH - nowH;
    if(dh <= 3){
      const hrs = Math.floor(dh), mins = Math.round((dh-hrs)*60);
      const parts = [];
      if(hrs>0) parts.push(hrs+"H");
      if(mins>0) parts.push(mins+"M");
      return {cls:"soon", label: parts.length? "STARTS IN "+parts.join(" ") : "STARTING NOW"};
    }
    return null;
  }
  return {cls:"done", label:"ENDED TODAY"};
}

/* filter match */
function passes(m){
  if(filters.free && m.cost!=="Free") return false;
  const hasGi = m.format==="Gi" || m.format==="Gi + No-Gi";
  const hasNoGi = m.format==="No-Gi" || m.format==="Gi + No-Gi";
  if(filters.gi && !hasGi) return false;
  if(filters.nogi && !hasNoGi) return false;
  return true;
}

/* day strip */
const strip = document.getElementById("daystrip");
DAYS.forEach((d,i)=>{
  const b=document.createElement("button");
  b.className="day"+(i===activeDay?" active":"");
  b.setAttribute("role","tab");
  b.innerHTML = d + '<span class="today-dot">'+(i===todayIdx?"TODAY":"")+'</span>';
  b.onclick=()=>{activeDay=i;render();};
  strip.appendChild(b);
});

/* filter chips */
document.querySelectorAll(".chip").forEach(ch=>{
  ch.onclick=()=>{
    const f=ch.dataset.f;
    filters[f]=!filters[f];
    ch.classList.toggle("on",filters[f]);
    render();
  };
});

/* map */
const map = L.map("map",{scrollWheelZoom:true}).setView([40.22,-74.55],8);
tileLayer=L.tileLayer(startTheme==="dark"?TILE_DARK:TILE_LIGHT,{attribution:'&copy; OpenStreetMap &copy; CARTO',maxZoom:19}).addTo(map);
function pinIcon(m,isActive){return L.divIcon({className:"",html:'<div class="mat-pin'+(isActive?"":" dim")+'" style="background:'+(isActive?'var(--mat)':'var(--mist)')+';color:#fff;font-family:Anton;font-size:12px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);border-radius:50%">'+m.gym[0]+'</div>',iconSize:[26,26],iconAnchor:[13,13]});}

function milesBetween(a,b){const R=3958.8,toR=x=>x*Math.PI/180;const dLat=toR(b.lat-a.lat),dLng=toR(b.lng-a.lng);const h=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));}

/* location */
const statusEl=document.getElementById("locstatus");
function setLoc(lat,lng,label){
  userLoc={lat,lng,label};
  try{localStorage.setItem("openmat-lastloc",JSON.stringify(userLoc));}catch(e){}
  statusEl.style.display="block";
  statusEl.innerHTML="Showing mats near <b>"+label+"</b><button id='clearLoc'>clear</button>";
  document.getElementById("clearLoc").onclick=()=>{userLoc=null;try{localStorage.removeItem("openmat-lastloc");}catch(e){}statusEl.style.display="none";map.setView([40.22,-74.55],8);render();};
  map.flyTo([lat,lng],10,{duration:.7});
  render();
}
async function nominatimLookup(query){
  const url="https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q="+encodeURIComponent(query+", New Jersey");
  const r=await fetch(url,{headers:{"Accept":"application/json"}});
  const d=await r.json();
  return (d&&d[0])?d[0]:null;
}
async function geocode(query){
  statusEl.style.display="block";statusEl.textContent="Searching…";
  try{
    const hit=await nominatimLookup(query);
    if(hit){const label=(hit.display_name||query).split(",").slice(0,2).join(",");setLoc(parseFloat(hit.lat),parseFloat(hit.lon),label);}
    else{statusEl.textContent="Location not found. Try a NJ zip or town name.";}
  }catch(e){statusEl.textContent="Search unavailable right now. Try Near Me instead.";}
}
document.getElementById("goBtn").onclick=()=>{const q=document.getElementById("q").value.trim();if(q)geocode(q);};
document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Enter"){const q=e.target.value.trim();if(q)geocode(q);}});
document.getElementById("nearBtn").onclick=()=>{
  if(!navigator.geolocation){statusEl.style.display="block";statusEl.textContent="Location not supported on this device.";return;}
  statusEl.style.display="block";statusEl.textContent="Finding you…";
  navigator.geolocation.getCurrentPosition(p=>setLoc(p.coords.latitude,p.coords.longitude,"your location"),()=>{statusEl.textContent="Could not get location. Type your zip or town instead.";});
};

/* share */
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.style.display="block";setTimeout(()=>t.style.display="none",2200);}
function shareMat(m){
  const text="Open mat @ "+m.gym+", "+m.town+" · "+(m.day!==null?DAYS[m.day]+" ":"")+m.start+(m.end?" to "+m.end:"")+(m.cost==="Free"?" · FREE":"")+" · found on OPENMAT "+SITE_URL;
  if(navigator.share){navigator.share({text}).catch(()=>{});}
  else{navigator.clipboard.writeText(text).then(()=>toast("Copied. Send it to the group chat.")).catch(()=>toast("Could not copy · screenshot it instead"));}
}

/* post a mat */
const overlay=document.getElementById("overlay");
const openModal=()=>{overlay.classList.add("open");document.getElementById("f-gym").focus();};
document.getElementById("openPost").onclick=openModal;
document.getElementById("openPost2").onclick=openModal;
document.getElementById("closePost").onclick=()=>overlay.classList.remove("open");
overlay.addEventListener("click",e=>{if(e.target===overlay)overlay.classList.remove("open");});
document.addEventListener("keydown",e=>{if(e.key==="Escape")overlay.classList.remove("open");});
function parseTimes(str){
  const m=(str||"").match(/(\d{1,2}(?::\d{2})?\s*(?:AM|PM))/gi)||[];
  const to24=s=>{const p=s.match(/(\d{1,2})(?::(\d{2}))?\s*(AM|PM)/i);if(!p)return null;let h=(+p[1])%12+(p[3].toUpperCase()==="PM"?12:0);return h+(+(p[2]||0))/60;};
  const norm=s=>s.replace(/\s+/g," ").toUpperCase().replace(/(AM|PM)/," $1").replace(/\s+/g," ").trim();
  return {start:m[0]?norm(m[0]):(str||"Check gym"), end:m[1]?norm(m[1]):"", startH:m[0]?to24(m[0]):null, endH:m[1]?to24(m[1]):null};
}
document.getElementById("sendPost").onclick=async()=>{
  const v=id=>document.getElementById(id).value.trim();
  const gym=v("f-gym"),town=v("f-town"),address=v("f-address");
  if(!gym||!town){toast("Gym name and town are required.");return;}
  const btn=document.getElementById("sendPost");btn.disabled=true;btn.textContent="Posting…";
  const t=parseTimes(v("f-time"));
  const day=DAY_NAMES.indexOf(v("f-day"));
  /* 1. put it on THIS device's map right away */
  let entry={gym,town,county:"",lat:null,lng:null,day:day<0?null:day,
    start:t.start,end:t.end,startH:t.startH,endH:t.endH,
    format:v("f-format"),cost:v("f-cost")||"Ask gym",
    verified:"pending",verifiedDate:new Date().toISOString().slice(0,10),site:"",ig:""};
  try{
    const hit=await nominatimLookup(address||town);
    if(hit){
      entry.lat=parseFloat(hit.lat);entry.lng=parseFloat(hit.lon);
      const county=(hit.display_name||"").split(",").map(s=>s.trim()).find(s=>/County$/.test(s));
      entry.county=county?county.replace(/\s*County$/,""):"";
    }
  }catch(e){}
  if(entry.lat!==null){
    PENDING.push(entry);savePending();
    if(entry.day!==null){activeDay=entry.day;}
    render();
    map.flyTo([entry.lat,entry.lng],13,{duration:.7});
  }
  /* 2. send it to us for verification (no email app needed) */
  const payload={_subject:"OPENMAT submission: "+gym+", "+town,Gym:gym,Address:address,Town:town,Day:v("f-day"),Time:v("f-time"),Format:v("f-format"),Cost:v("f-cost"),Contact:v("f-contact"),Pin:entry.lat!==null?entry.lat+", "+entry.lng:"geocode failed"};
  let sent=false;
  try{
    const r=await fetch(FORM_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(payload)});
    const j=await r.json().catch(()=>({}));
    sent=r.ok && String(j.success).toLowerCase()==="true"; /* FormSubmit returns 200 even pre-activation */
  }catch(e){}
  if(!sent){
    const lines=["NEW OPEN MAT SUBMISSION","","Gym: "+gym,"Address: "+address,"Town: "+town,"Day: "+v("f-day"),"Time: "+v("f-time"),"Format: "+v("f-format"),"Cost: "+v("f-cost"),"Contact: "+v("f-contact")];
    window.location.href="mailto:"+SUBMIT_EMAIL+"?subject="+encodeURIComponent("OPENMAT submission: "+gym+", "+town)+"&body="+lines.join("%0D%0A");
  }
  btn.disabled=false;btn.textContent="Send it";
  overlay.classList.remove("open");
  ["f-gym","f-address","f-town","f-time","f-cost","f-contact"].forEach(id=>document.getElementById(id).value="");
  toast(entry.lat!==null?"On your map · sent for verification":"Sent for verification");
};

/* render */
function render(){
  document.querySelectorAll(".day").forEach((el,i)=>el.classList.toggle("active",i===activeDay));
  let active = allMats().filter(m=>m.day===activeDay && passes(m));
  let anytime = allMats().filter(m=>m.day===null && passes(m));
  if(userLoc){
    const withD=x=>({...x,_d:milesBetween(userLoc,x)});
    active=active.map(withD).sort((a,b)=>a._d-b._d);
    anytime=anytime.map(withD).sort((a,b)=>a._d-b._d);
  }
  const show=active.concat(anytime);
  document.getElementById("count").innerHTML="<b>"+active.length+"</b> open mat"+(active.length===1?"":"s")+" · "+DAYS[activeDay]+(anytime.length?" &nbsp;·&nbsp; +"+anytime.length+" on gym schedule":"")+(userLoc?" &nbsp;·&nbsp; nearest first":"");

  const wrap=document.getElementById("cards");wrap.replaceChildren();
  const addEl=(parent,tag,cls,text)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined&&text!==null)el.textContent=text;parent.appendChild(el);return el;};

  if(show.length===0){
    const e=addEl(wrap,"div","empty");
    addEl(e,"div","big","No mats listed");
    e.appendChild(document.createTextNode(userLoc
      ?"Nothing on "+DAYS[activeDay]+" near you. Check the rest of the week below, or post a mat we're missing."
      :"Nothing matches for "+DAYS[activeDay]+". Try clearing filters, or post a mat we're missing."));
  }

  function makeCard(m, dayLabel){
    const st=(!dayLabel && activeDay===todayIdx)?matStatus(m):null;
    const c=document.createElement("div");
    c.className="card"+(st&&st.cls==="done"?" done":st&&st.cls==="live"?" live":"");
    if(st) addEl(c,"span","status "+st.cls,st.label);
    if(dayLabel) addEl(c,"span","status soon",dayLabel);
    const top=addEl(c,"div","card-top");
    const left=addEl(top,"div");
    addEl(left,"div","gym",m.gym);
    const town=addEl(left,"div","town",m.town+" · "+m.county+" County"+(m._d!==undefined?" · ":""));
    if(m._d!==undefined) addEl(town,"span","dist",m._d.toFixed(1)+" mi");
    const time=addEl(top,"div","time",m.start);
    if(m.end) addEl(time,"small",null,"TO "+m.end);
    const tags=addEl(c,"div","tags");
    addEl(tags,"span","tag"+(m.cost==="Free"?" free":""),m.cost);
    addEl(tags,"span","tag",m.format);
    const foot=addEl(c,"div","card-foot");
    const ver=addEl(foot,"span","verify "+(m.verified==="confirmed"?"ok":"warn"),
      m.verified==="confirmed"?"✓":m.verified==="pending"?"◌ pending review":"◌");
    ver.title=m.verified==="pending"?"Posted from this device · being verified":"Last checked "+m.verifiedDate;
    const actions=addEl(foot,"span","foot-actions");
    if(m.site){const siteA=addEl(actions,"a","golink","Site");siteA.href=m.site;siteA.target="_blank";siteA.rel="noopener";}
    if(m.ig){const igA=addEl(actions,"a","golink","IG");igA.href=m.ig;igA.target="_blank";igA.rel="noopener";}
    const shareB=addEl(actions,"button","sharelink","Share");shareB.dataset.share="";
    shareB.onclick=(e)=>{e.stopPropagation();shareMat(m);};
    c.onclick=(e)=>{if(e.target.tagName!=="A"&&!e.target.dataset.hasOwnProperty("share")){map.flyTo([m.lat,m.lng],12,{duration:.6});}};
    return c;
  }

  show.forEach(m=>wrap.appendChild(makeCard(m,null)));

  /* when searching near a location, always show the rest of the week nearby
     so a zip search never dead-ends on an empty day */
  if(userLoc){
    const others=allMats().filter(m=>m.day!==null && m.day!==activeDay && passes(m))
      .map(x=>({...x,_d:milesBetween(userLoc,x)}))
      .sort((a,b)=>a._d-b._d)
      .slice(0,6);
    if(others.length){
      const h=addEl(wrap,"div","count","More near you this week");
      h.style.marginTop="22px";
      others.forEach(m=>wrap.appendChild(makeCard(m,DAYS[m.day])));
    }
  }

  markers.forEach(x=>map.removeLayer(x));markers=[];
  const groups = {};
  allMats().filter(m=>m.lat!==null).forEach(m=>{
    const key = m.gym+"|"+m.lat+"|"+m.lng;
    (groups[key] = groups[key] || []).push(m);
  });
  Object.values(groups).forEach(list=>{
    const m = list[0];
    const isActive = list.some(x=>(x.day===activeDay||x.day===null)&&passes(x));
    const sessions = list.map(x=>(x.day!==null?DAYS[x.day]+" ":"")+x.start+(x.end?"–"+x.end:"")).join("<br>");
    const mk=L.marker([m.lat,m.lng],{icon:pinIcon(m,isActive),opacity:isActive?1:.5}).addTo(map);
    mk.bindPopup("<b>"+m.gym+"</b><br>"+m.town+"<br>"+sessions);
    markers.push(mk);
  });
  if(youMarker){map.removeLayer(youMarker);youMarker=null;}
  if(userLoc){youMarker=L.marker([userLoc.lat,userLoc.lng],{icon:L.divIcon({className:"",html:'<div style="background:var(--ink);width:14px;height:14px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px var(--ink)"></div>',iconSize:[14,14],iconAnchor:[7,7]})}).addTo(map);}
}
/* pick up where they left off: restore last search */
(()=>{try{const s=JSON.parse(localStorage.getItem("openmat-lastloc"));if(s&&typeof s.lat==="number"){setLoc(s.lat,s.lng,s.label);return;}}catch(e){}render();})();
setInterval(render, 60000); /* refresh statuses every minute */
</script>
